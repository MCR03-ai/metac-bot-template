name: KI-Spaeher
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  spaeher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Spaeher laufen lassen
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIN_REST_USD: "4"
        run: python spaeher/spaeher.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaeher-bericht
          path: out/
          retention-days: 7
